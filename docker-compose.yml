# =============================================================
# docker-compose.yml — Plataforma de Trading y Alertas
# Etapa 1: solo infraestructura (Zookeeper, Kafka, RabbitMQ, PostgreSQL)
# Los microservicios Java se agregarán en la Etapa 9.
# =============================================================

services:

  # -----------------------------------------------------------
  # ZOOKEEPER — coordinador del clúster de Kafka
  # -----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=srvr,ruok"
    ports:
      - "2181:2181"
    networks:
      - trading-internal
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------
  # KAFKA — broker de eventos del Cold-Path
  # Topics: historical_ticks (5 particiones), trading_signals (3 particiones)
  # -----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dos listeners: interno (para contenedores) y externo (para host)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Replicación mínima para entorno de desarrollo
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      # Retención de mensajes: 7 días (suficiente para proyecto académico)
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # Auto-creación de topics desactivada: se crean explícitamente
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"   # Acceso externo desde el host
    networks:
      - trading-internal
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # -----------------------------------------------------------
  # KAFKA INIT — crea los topics necesarios al arrancar
  # Se ejecuta una sola vez y sale (no es un servicio permanente)
  # -----------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trading-internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo 'Creando topic historical_ticks (5 particiones)...'
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic historical_ticks --partitions 5 --replication-factor 1
        echo 'Creando topic trading_signals (3 particiones)...'
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic trading_signals --partitions 3 --replication-factor 1
        echo 'Topics disponibles:'
        kafka-topics --bootstrap-server kafka:9092 --list
    restart: "no"

  # -----------------------------------------------------------
  # RABBITMQ — broker del Hot-Path
  # Interfaz de gestión en http://localhost:15672 (guest/guest)
  # -----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"    # AMQP — microservicios
      - "15672:15672"  # Management UI — verificación manual
    networks:
      - trading-internal
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -----------------------------------------------------------
  # POSTGRESQL — persistencia relacional
  # Base de datos: trading_db
  # Tablas: tick_records, trading_signals, notification_log
  # -----------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_pass
    ports:
      - "5432:5432"
    networks:
      - trading-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# =============================================================
# REDES
# trading-internal: red bridge interna, aísla los servicios
#                   del exterior. Los microservicios Java
#                   también se conectarán a esta red.
# =============================================================
networks:
  trading-internal:
    driver: bridge
    name: trading-internal

# =============================================================
# VOLÚMENES NOMBRADOS — persistencia ante reinicios
# =============================================================
volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  rabbitmq-data:
  postgres-data:
