# =============================================================
# docker-compose.yml — Plataforma de Trading y Alertas
# Infraestructura + 8 microservicios Java
# =============================================================

services:

  # -----------------------------------------------------------
  # ZOOKEEPER — coordinador del clúster de Kafka
  # -----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=srvr,ruok"
    ports:
      - "2181:2181"
    networks:
      - trading-internal
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------
  # KAFKA — broker de eventos del Cold-Path
  # -----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    networks:
      - trading-internal
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # -----------------------------------------------------------
  # KAFKA INIT — crea los topics al arrancar y sale
  # -----------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trading-internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo 'Creando topic historical_ticks (5 particiones)...'
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic historical_ticks --partitions 5 --replication-factor 1
        echo 'Creando topic trading_signals (3 particiones)...'
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic trading_signals --partitions 3 --replication-factor 1
        echo 'Topics disponibles:'
        kafka-topics --bootstrap-server kafka:9092 --list
    restart: "no"

  # -----------------------------------------------------------
  # RABBITMQ — broker del Hot-Path
  # -----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - trading-internal
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -----------------------------------------------------------
  # POSTGRESQL — persistencia relacional
  # -----------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_pass
    ports:
      - "5432:5432"
    networks:
      - trading-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =============================================================
  # MICROSERVICIOS JAVA
  # =============================================================

  # -----------------------------------------------------------
  # 1. market_data_feed — genera ticks y los publica en RabbitMQ
  # -----------------------------------------------------------
  market_data_feed:
    build:
      context: ./services/market_data_feed
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    networks:
      - trading-internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # -----------------------------------------------------------
  # 2. live_dashboard_backend — ticks en vivo por WebSocket
  # -----------------------------------------------------------
  live_dashboard_backend:
    build:
      context: ./services/live_dashboard_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    ports:
      - "8081:8081"
    networks:
      - trading-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health 2>/dev/null || wget -qO- http://localhost:8081/ 2>/dev/null | grep -q '.' && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # -----------------------------------------------------------
  # 3. ingestion_bridge — puente RabbitMQ → Kafka
  # -----------------------------------------------------------
  ingestion_bridge:
    build:
      context: ./services/ingestion_bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trading-internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # -----------------------------------------------------------
  # 4. analytics_engine — motor de análisis (Cold-Path)
  # -----------------------------------------------------------
  analytics_engine:
    build:
      context: ./services/analytics_engine
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASS: trading_pass
    networks:
      - trading-internal
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  # -----------------------------------------------------------
  # 5. investment_dashboard_backend — señales por WebSocket
  # -----------------------------------------------------------
  investment_dashboard_backend:
    build:
      context: ./services/investment_dashboard_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    networks:
      - trading-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health 2>/dev/null || wget -qO- http://localhost:8082/ 2>/dev/null | grep -q '.' && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # -----------------------------------------------------------
  # 6. notification_router — enruta señales Kafka → RabbitMQ
  # -----------------------------------------------------------
  notification_router:
    build:
      context: ./services/notification_router
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASS: trading_pass
    networks:
      - trading-internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # -----------------------------------------------------------
  # 7. email_worker — simula envío de emails (x2 réplicas)
  # -----------------------------------------------------------
  email_worker:
    build:
      context: ./services/email_worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    networks:
      - trading-internal
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # -----------------------------------------------------------
  # 8. console_alert_worker — imprime alertas en consola
  # -----------------------------------------------------------
  console_alert_worker:
    build:
      context: ./services/console_alert_worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    networks:
      - trading-internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

# =============================================================
# REDES
# =============================================================
networks:
  trading-internal:
    driver: bridge
    name: trading-internal

# =============================================================
# VOLÚMENES NOMBRADOS
# =============================================================
volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  rabbitmq-data:
  postgres-data:
