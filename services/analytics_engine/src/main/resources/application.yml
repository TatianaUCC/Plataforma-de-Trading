spring:
  application:
    name: analytics-engine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: analytics-engine-group
      auto-offset-reset: latest
  # PostgreSQL — configurado para que Spring Boot arranque sin error,
  # pero JPA no escribe todavía (ddl-auto=none).
  # La persistencia de tick_records y trading_signals se activa en etapa posterior.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading_db}
    username: ${POSTGRES_USER:trading_user}
    password: ${POSTGRES_PASS:trading_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

logging:
  level:
    com.trading.analytics: INFO
