# rabbitmq.conf — Configuración mínima para el proyecto de trading
# El plugin de Management (UI en :15672) se activa vía RABBITMQ_PLUGINS
# en el docker-compose.yml, no hace falta declararlo aquí.

# Nivel de log: solo errores y advertencias en producción académica
log.console.level = warning

# Tiempo máximo de espera de heartbeat (segundos)
heartbeat = 60

# Tamaño máximo de mensaje: 10 MB (suficiente para ticks JSON pequeños)
max_message_size = 10485760
